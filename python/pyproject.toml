[project]
name = "bma-sdk"
version = "2.1.0"
description = "Python client for BMA: the official Anthropic SDK with the BMA extensions (machines, machine pools, desktop and terminal sessions) under client.beta."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "anthropic==2.6.0",
]

[project.urls]
Repository = "https://github.com/beeos-ai/bma-sdk"

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "pyright==1.1.414"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bma_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/bma_sdk/_generated"]
pythonVersion = "3.10"
reportUnnecessaryTypeIgnoreComment = "error"
