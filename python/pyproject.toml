[project]
name = "bma-sdk"
version = "1.0.1"
description = "Python client for the BMA REST API and the BMA extensions to the Anthropic Managed Agents API."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "typing-extensions>=4.10",
]

[project.urls]
Repository = "https://github.com/beeos-ai/bma-sdk"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyright==1.1.407"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bma_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src", "examples", "tests/typecheck"]
exclude = ["src/bma_sdk/_generated"]
pythonVersion = "3.10"
strict = ["examples", "tests/typecheck"]
reportUnnecessaryTypeIgnoreComment = "error"
