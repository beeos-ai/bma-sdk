name: Release

# One tag vX.Y.Z releases all three SDKs at the same version: the Go module
# comes from the tag itself, npm and PyPI are published below.
on:
  push:
    tags:
      - 'v*'
  # Re-release an existing tag with the workflow from the current main (a
  # rerun would reuse the old commit's workflow). Never moves the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v0.4.2
        required: true
        type: string
      publish:
        description: Which registry to publish to
        type: choice
        options: [all, npm, pypi]
        default: all

permissions:
  contents: read

jobs:
  checks:
    name: CI
    uses: ./.github/workflows/ci.yaml

  verify:
    name: Verify the tag is on main and matches every package version
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify release tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Verify the tag matches the package versions
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          tag_version="${tag#v}"
          ts_version="$(node -p "require('./typescript/package.json').version")"
          py_version="$(python3 -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          for pair in "typescript/package.json:$ts_version" "python/pyproject.toml:$py_version"; do
            if [ "$tag_version" != "${pair#*:}" ]; then
              printf 'tag %s does not match %s version %s\n' "$tag" "${pair%%:*}" "${pair#*:}" >&2
              exit 1
            fi
          done

  npm:
    if: github.event_name == 'push' || inputs.publish == 'all' || inputs.publish == 'npm'
    name: Publish @beeos-ai/bma-sdk to npm
    needs: [checks, verify]
    runs-on: ubuntu-latest
    environment:
      name: releases
      url: https://www.npmjs.com/package/@beeos-ai/bma-sdk
    permissions:
      contents: read
      # The OIDC token signs the provenance statement; authentication to the
      # registry uses the NPM_TOKEN secret of the releases environment.
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  pypi:
    if: github.event_name == 'push' || inputs.publish == 'all' || inputs.publish == 'pypi'
    name: Publish bma-sdk to PyPI
    needs: [checks, verify]
    runs-on: ubuntu-latest
    environment:
      name: releases
      url: https://pypi.org/project/bma-sdk/
    permissions:
      contents: read
      # PyPI Trusted Publishing exchanges this job's OIDC token for an upload
      # token, so the release never needs a long-lived PyPI API token.
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build sdist and wheel
        working-directory: python
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
