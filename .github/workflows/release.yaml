name: Release

# One tag vX.Y.Z releases all three SDKs at the same version: the Go module
# comes from the tag itself, npm and PyPI are published below.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  checks:
    name: CI
    uses: ./.github/workflows/ci.yaml

  verify:
    name: Verify the tag is on main and matches every package version
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify the tag matches the package versions
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          ts_version="$(node -p "require('./typescript/package.json').version")"
          py_version="$(python3 -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          for pair in "typescript/package.json:$ts_version" "python/pyproject.toml:$py_version"; do
            if [ "$tag_version" != "${pair#*:}" ]; then
              printf 'tag %s does not match %s version %s\n' "$GITHUB_REF_NAME" "${pair%%:*}" "${pair#*:}" >&2
              exit 1
            fi
          done

  npm:
    name: Publish @beeos-ai/bma-sdk to npm
    needs: [checks, verify]
    runs-on: ubuntu-latest
    environment:
      name: releases
      url: https://www.npmjs.com/package/@beeos-ai/bma-sdk
    permissions:
      contents: read
      # npm Trusted Publishing exchanges this job's OIDC token for a publish
      # token (and signs provenance), so no long-lived npm token is stored.
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs npm >= 11.5.1, bundled with Node 24.
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public --provenance

  pypi:
    name: Publish bma-sdk to PyPI
    needs: [checks, verify]
    runs-on: ubuntu-latest
    environment:
      name: releases
      url: https://pypi.org/project/bma-sdk/
    permissions:
      contents: read
      # PyPI Trusted Publishing exchanges this job's OIDC token for an upload
      # token, so the release never needs a long-lived PyPI API token.
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build sdist and wheel
        working-directory: python
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
