            retrieve: getDesktopSession
            close: closeDesktopSession
            screenshot: captureDesktopScreenshot
            sendActions: sendDesktopActions
          subresources:
            control:
              methods:
                retrieve: getDesktopControl
                acquire: acquireDesktopControl
                renew: renewDesktopControl
                release: releaseDesktopControl
                handback: handbackDesktopControl
            agent:
              methods:
                observe: observeDesktop
                resume: resumeDesktopAgent
                submitAction: submitDesktopAction
                confirmAction: confirmDesktopAction
        terminalSessions:
          methods:
            create: createTerminalSession
            list: listTerminalSessions
            retrieve: getTerminalSession
            close: closeTerminalSession
            connectionTicket: createTerminalConnectionTicket
    projects:
      methods:
        create: createProject
        list: listVisibleProjects
        delete: {operation: deleteProject, positional: [projectID]}
        usage: getProjectUsage
    orgs:
      methods:
        create: createOrganization
        list: listOrganizations
        delete: {operation: deleteOrganization, positional: [orgID]}
        overview: getOrgOverview
        usage: getOrgUsage
        usageTimeseries: getOrgUsageTimeseries
      subresources:
        members:
          methods:
            list: listOrgMembers
            update: updateOrgMember
            remove: removeOrgMember
          subresources:
            projects:
              methods:
                list: listMemberProjectAccess
                set: {operation: setMemberProjectAccess, positional: [projectID]}
                remove: {operation: removeMemberProjectAccess, positional: [projectID]}
        apiKeys:
          methods:
            create: createOrgAPIKey
            list: listOrgAPIKeys
            retrieve: getOrgAPIKey
            update: updateOrgAPIKey
            revoke: revokeOrgAPIKey
          subresources:
            projects:
              methods:
                list: listOrgAPIKeyProjectAccess
                set: {operation: setOrgAPIKeyProjectRole, positional: [projectID]}
                remove: {operation: removeOrgAPIKeyProjectRole, positional: [projectID]}
        invitations:
          methods:
            create: createOrgInvitation
            list: listOrgInvitations
            delete: deleteOrgInvitation
        skills:
          methods:
            create: createSkill
            list: listSkills
            retrieve: getSkill
            update: updateSkill
            delete: deleteSkill
          subresources:
            grants:
              methods:
                create: createSkillGrant
                list: listSkillGrants
                delete: deleteSkillGrant
        secrets:
          methods:
            create: createSecret
            list: listSecrets
            retrieve: getSecret
            update: updateSecret
            delete: deleteSecret
            startMcpOAuth: startSecretMCPOAuth
          subresources:
            versions:
              methods:
                create: createSecretVersion
            grants:
              methods:
                create: createSecretGrant
                list: listSecretGrants
                delete: deleteSecretGrant
        machines:
          methods:
            create: createMachine
            list: listVisibleMachines
            connect: connectBYOMachine
            retrieve: getMachine
            update: updateMachine
            delete: deleteMachine
          subresources:
            daemonTokens:
              methods:
                create: createBYOMachineDaemonToken
                list: listBYOMachineDaemonTokens
                revoke: revokeMachineDaemonToken
        machinePools:
          methods:
            create: createMachinePool
            list: listMachinePools
            retrieve: getMachinePool
            update: updateMachinePool
            delete: deleteMachinePool
            checkConnection: checkMachinePoolConnection
        modelProviders:
          methods:
            create: createModelProviderConfig
            list: listModelProviderConfigs
            retrieve: getModelProviderConfig
            update: updateModelProviderConfig
            delete: deleteModelProviderConfig
            catalog: getModelCatalog
          subresources:
            models:
              methods:
                create: createConfiguredModel
                list: listConfiguredModels
                update: updateConfiguredModel
                delete: deleteConfiguredModel
        memoryStores:
          methods:
            list: listOrgMemoryStores
        agents:
          methods:
            list: listOrgAgents
        agentProfiles:
          methods:
            list: listOrgAgentProfiles
        integrations:
          methods:
            list: listOrgIntegrations
    me:
      methods:
        retrieve: getCurrentUser
        delete: deleteCurrentUser
    personalAccessTokens:
      methods:
        create: createPersonalAccessToken
        list: listPersonalAccessTokens
        revoke: revokePersonalAccessToken
    invitations:
      methods:
        list: listPendingInvitations
        accept: acceptInvitation
        decline: declineInvitation
    toolCatalog:
      methods:
        retrieve: getToolCatalog

  # Reachable only through the escape hatch (TypeScript `bma.rest`).
  internal:
    # Machine Daemon: called by bmad with a machine token, not by SDK users.
    - bootstrapDaemon
    - recordMachineFailure
    - getDaemonGitCredentials
    - getDaemonSkillArchive
    - uploadDaemonFile
    - downloadDaemonFile
    - uploadDaemonMachineBackupArchive
    - downloadDaemonMachineBackupArchive
    - listDaemonSessionFiles
    - downloadDaemonSessionFile
    - uploadDaemonSessionOutput
    - reportDaemonMachineBackupRestore
    - getDaemonMachineBackupRestore
    # 101 WebSocket upgrade, not a request/response operation.
    - signalDesktopSession

facade:
  resources:
    sessions:
      subresources:
        files:
          methods:
            upload: uploadSessionFile
            list: listSessionFiles
            download: downloadSessionFile
        resources:
          methods:
            add: addSessionResource
            list: listSessionResources
            delete: deleteSessionResource
        desktop:
          methods:
            stream: getSessionDesktopStream
  internal: []
