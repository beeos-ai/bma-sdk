# Resource tree of the bma-sdk clients (ADR 0012, Lead decision D1).
#
# Every operationId in rest.openapi.yaml and facade-extensions.openapi.yaml
# must appear exactly once: either as a resource method below or under
# `internal`. tools/sdkgen/sdkgen.py fails on an unmapped, unknown or
# duplicated operation, so a new contract operation cannot slip out of the SDK
# unnamed. The layout follows the Stainless config (`resources.<name>.methods`,
# `subresources`), keyed by operationId instead of "verb path".
#
# A method is either `name: operationId` or
# `name: {operation: operationId, positional: [pathParam, ...]}`.
# Path parameters orgID and projectID are scope parameters: they default to
# the client's orgId/projectId and can be overridden with `org_id` /
# `project_id` in params. `positional` turns a scope parameter into a
# positional argument where it names the target rather than the scope.
#
# Method names: TypeScript and Python use them as written (Python in
# snake_case); Go capitalises them and maps create->New, retrieve->Get.

header_params:
  # Idempotency-Key is RequestOptions.idempotencyKey, not a params field.
  X-BMA-File-Metadata: file_metadata
  Last-Event-ID: last_event_id

rest:
  resources:
    agents:
      methods:
        create: createAgent
        list: listAgents
        retrieve: getAgent
        archive: archiveAgent
        cancel: cancelAgent
        updateConfig: updateAgentConfig
        usage: getAgentUsage
      subresources:
        sessions:
          methods:
            create: createAgentSession
            list: listAgentSessions
            retrieve: getAgentSession
            update: updateAgentSession
            archive: archiveAgentSession
            cancel: cancelAgentSession
          subresources:
            modelOverride:
              methods:
                retrieve: GetAgentSessionModelOverride
                set: PutAgentSessionModelOverride
                update: PatchAgentSessionModelOverride
                delete: DeleteAgentSessionModelOverride
            artifacts:
              methods:
                list: listSessionArtifacts
                upload: uploadSessionArtifact
                download: getSessionArtifactContent
                promote: promoteSessionArtifact
            resources:
              methods:
                list: listSessionResources
                add: addSessionResource
                delete: deleteSessionResource
        inputs:
          methods:
            create: createAgentInput
            listBacklog: listQueuedBacklogInputs
            cancel: cancelQueuedBacklogInput
            move: moveQueuedBacklogInput
            promoteToSteering: promoteQueuedInputToSteering
            demoteToQueued: demoteSteeringInputToQueued
        events:
          methods:
            list: listEvents
            stream: streamEvents
        turns:
          methods:
            list: listTurns
          subresources:
            events:
              methods:
                list: listTurnEvents
        toolCalls:
          methods:
            list: listToolCalls
            retrieve: getToolCall
            submitResult: submitToolCallResult
        interactions:
          methods:
            list: listAgentInteractions
            resolve: resolveAgentInteraction
        machines:
          methods:
            list: listAgentMachines
            create: createAgentPersistentMachine
            delete: deleteAgentMachine
        modelOverride:
          methods:
            retrieve: GetAgentModelOverride
            set: PutAgentModelOverride
            update: PatchAgentModelOverride
            delete: DeleteAgentModelOverride
        executorBinding:
          methods:
            retrieve: GetAgentExecutorBinding
            set: PutAgentExecutorBinding
        artifacts:
          methods:
            retrieve: getArtifact
            download: getArtifactContent
    sessions:
      methods:
        list: listProjectAgentSessions
        retrieve: getProjectAgentSession
    agentConfigs:
      methods:
        create: createAgentConfig
        retrieve: getAgentConfig
        generatedSource: getAgentConfigGeneratedSource
        resolveTools: resolveAgentConfigTools
    agentProfiles:
      methods:
        create: createAgentProfile
        list: listAgentProfiles
        retrieve: getAgentProfile
        rename: renameAgentProfile
        delete: deleteAgentProfile
        usage: getAgentProfileUsage
        updateConfig: updateAgentProfile
    cronTriggers:
      methods:
        create: createCronTrigger
        list: listCronTriggers
        retrieve: getCronTrigger
        update: updateCronTrigger
        delete: deleteCronTrigger
    eventWebhooks:
      methods:
        create: createEventWebhook
        list: listEventWebhooks
        update: updateEventWebhook
        delete: deleteEventWebhook
    files:
      methods:
        upload: uploadFile
        list: listFiles
        retrieve: getFile
        delete: deleteFile
        download: getFileContent
    memoryStores:
      methods:
        create: createMemoryStore
        list: listMemoryStores
        retrieve: getMemoryStore
        update: updateMemoryStore
        delete: deleteMemoryStore
      subresources:
        files:
          methods:
            list: listMemoryFiles
            download: downloadMemoryFile
            write: writeMemoryFile
            delete: deleteMemoryFile
    actors:
      methods:
        list: listActors
        upsert: putActor
        retrieve: getActor
    integrations:
      methods:
        create: createIntegration
        list: listIntegrations
        retrieve: getIntegration
        update: updateIntegration
        delete: deleteIntegration
        configure: configureIntegration
        disconnect: disconnectIntegration
        createOAuthSetup: createIntegrationOAuthSetup
        createSlackSetup: createIntegrationSlackSetup
        createGitHubSetup: createIntegrationGitHubSetup
        inspectGitHubInstallations: inspectIntegrationGitHubInstallations
        listGitHubRepositories: listIntegrationGitHubRepositories
      subresources:
        subscriptions:
          methods:
            create: createIntegrationSubscription
            list: listIntegrationSubscriptions
            delete: deleteIntegrationSubscription
    integrationDefinitions:
      methods:
        list: listIntegrationDefinitions
    machineGrants:
      methods:
        create: createProjectMachineGrant
        list: listProjectMachineGrants
        delete: deleteProjectMachineGrant
    machinePoolGrants:
      methods:
        create: createProjectMachinePoolGrant
        list: listProjectMachinePoolGrants
        retrieve: getProjectMachinePoolGrant
        update: updateProjectMachinePoolGrant
        delete: deleteProjectMachinePoolGrant
    modelGrants:
      methods:
        create: createProjectModelGrant
        list: listProjectModelGrants
        update: updateProjectModelGrant
        delete: deleteProjectModelGrant
    secrets:
      methods:
        list: listProjectAvailableSecrets
        retrieve: getProjectAvailableSecret
    skills:
      methods:
        list: listProjectAvailableSkills
    mcpServers:
      methods:
        list: listMCPServers
      subresources:
        tools:
          methods:
            list: listMCPServerTools
    machines:
      methods:
        list: listVisibleProjectMachines
        capabilities: getMachineCapabilities
        resume: resumeMachine
