              format: int32
        - type: object
          required:
          - provider
          - default_machine_memory_mb
          - max_total_memory_mb
          - max_machine_memory_mb
          properties:
            provider:
              type: string
              enum:
              - blaxel
            default_machine_memory_mb:
              type: integer
              format: int32
            max_total_memory_mb:
              type: integer
              format: int32
            max_machine_memory_mb:
              type: integer
              format: int32
          not:
            anyOf:
            - required:
              - default_machine_cpu
            - required:
              - max_total_cpu
            - required:
              - min_machine_cpu
            - required:
              - max_machine_cpu
    CreateMachinePoolRequestBase:
      type: object
      additionalProperties: false
      required:
      - name
      - provider
      - default_machine_provider_options
      - provider_auth_secret_id
      - max_total_machines
      properties:
        name:
          $ref: '#/components/schemas/ResourceName'
        description:
          type: string
        provider:
          type: string
          minLength: 1
        default_machine_cpu:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        default_machine_memory_mb:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        default_machine_env:
          description: Default environment for pool machines. A machine's environment, including resolved secret_env values,
            is applied to the provider machine at provisioning, so the provider_options startup_script and the daemon run
            with it, and is resolved again for each process at launch.
          type: object
          additionalProperties:
            type: string
        default_machine_secret_env:
          description: Default secret environment for pool machines, mapping env names to generic secret references. References
            are resolved to secret values wherever the machine environment is applied.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SecretID'
        default_machine_provider_options:
          type: object
          additionalProperties: true
        default_cwd:
          type: string
        provider_config:
          type: object
          additionalProperties: true
        provider_auth_secret_id:
          $ref: '#/components/schemas/SecretID'
        runtime_protection_enabled:
          description: Whether BMA should delete a pool machine when its provider remains running after its daemon becomes
            inactive. Defaults to false when omitted.
          type: boolean
          default: false
        max_total_machines:
          description: 'Deprecated, not enforced: how many machines a pool has no longer blocks new machines. Organization
            and project quotas over in-use machines (org resource limits max_in_use_pool_machines_per_project and max_in_use_pool_machines_per_org)
            govern capacity.'
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        max_total_cpu:
          description: 'Deprecated, not enforced: organization and project in-use machine CPU quotas govern capacity.'
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        max_total_memory_mb:
          description: 'Deprecated, not enforced: organization and project in-use machine memory quotas govern capacity.'
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        min_machine_cpu:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        min_machine_memory_mb:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        max_machine_cpu:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        max_machine_memory_mb:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        delete_after_idle_minutes:
          description: Idle minutes before deleting a machine from this pool. Omit to leave the pool default unset; a grant
            or agent source may still override it.
          type: integer
          format: int32
          minimum: 5
          maximum: 2147483647
        pause_after_idle_minutes:
          description: Idle minutes before pausing a machine from this pool. A paused machine keeps its disk and resumes on
            the next command, terminal, desktop, or explicit resume. Exclusive with delete_after_idle_minutes; a grant or
            agent source delete policy still wins.
          type: integer
          format: int32
          minimum: 5
          maximum: 2147483647
        archive_after_paused_days:
          description: Days a machine stays paused before it is archived. An archived machine is restored on the next access.
            Requires pause_after_idle_minutes.
          type: integer
          format: int32
          minimum: 1
          maximum: 3650
        delete_after_paused_days:
          description: Days a machine stays paused before it is deleted, counted from when it paused; a resume ends the paused
            period and the next pause starts a new one. A session that receives input after its machine was deleted gets a
            fresh machine. Machines kept for a person (idle deletion disabled with 0 on their binding or grant) are never
            deleted by it. Requires pause_after_idle_minutes; cannot be combined with archive_after_paused_days.
          type: integer
          format: int32
          minimum: 1
          maximum: 3650
        metadata:
          $ref: '#/components/schemas/MachineMetadata'
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          $ref: '#/components/schemas/ResourceName'
x-bma-extension-fields:
- operation: POST /v1/sessions, POST /v1/sessions/{session_id}
  direction: request
  field: bma_model_override
  description: The one shape of a session model override. On create it needs `model` and lasts for the session (`expires_with_session`
    defaults to true unless `ttl_seconds` is sent); it replaces the deprecated `agent.model.api_url/api_key/api_format/context_window_tokens/max_output_tokens/auto_compact_window_tokens`,
    which are still accepted (answered with `Deprecation` and a `Link ... rel="successor-version"` header) but cannot be combined
    with it. On update, an object with `model` replaces the override (native PutAgentSessionModelOverride); an object without
    `model` patches it (PatchAgentSessionModelOverride); null revokes it (DeleteAgentSessionModelOverride). `api_key` is write-only.
  schema:
    oneOf:
    - $ref: '#/components/schemas/AgentModelOverrideInput'
    - $ref: '#/components/schemas/AgentModelOverridePatch'
    - type: 'null'
- operation: GET /v1/sessions/{session_id}, POST /v1/sessions, POST /v1/sessions/{session_id}
  direction: response
  field: bma_model_override
  description: The active override metadata (native AgentModelOverride, no key) or null; omitted by list and by deployments
    that cannot read overrides.
  schema:
    oneOf:
    - $ref: '#/components/schemas/AgentModelOverride'
    - type: 'null'
