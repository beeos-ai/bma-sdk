      description: 'Whether the machine''s executor declared capabilities.session_files at its latest executor.register: each
        session''s files then live in its own directory below the declared root instead of /mnt/session. A Claude Managed
        Agents compatible self_hosted environment accepts file resources only when this is true (BMA extension; CMA always
