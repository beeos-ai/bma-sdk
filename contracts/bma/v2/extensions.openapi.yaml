    - type: 'null'
- operation: POST /v1/sessions
  direction: request
  field: bma_placement
  description: Chooses the brain and hands machine for this session among the environment's candidates; omitted lets the scheduler
    choose.
  schema:
    oneOf:
    - $ref: '#/components/schemas/BmaSessionPlacementRequest'
    - type: 'null'
- operation: GET /v1/sessions, GET /v1/sessions/{session_id}, POST /v1/sessions, POST /v1/sessions/{session_id}
  direction: response
  field: bma_placement
  description: Where the session's brain and hands are bound and whether each is waiting; omitted for a session created without
    a placement.
  schema:
    oneOf:
    - $ref: '#/components/schemas/BmaSessionPlacement'
    - type: 'null'
- operation: GET /v1/environments, GET /v1/environments/{environment_id}
  direction: response
  field: bma_machine
  description: Present on an environment projected from a machine (read-only, no writes); absent on a cloud environment.
