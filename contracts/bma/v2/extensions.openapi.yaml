    AgentModelOverride:
      type: object
      additionalProperties: false
      required:
      - id
      - agent_id
      - session_id
      - model
      - api_format
      - base_url
      - fingerprint
      - created_at
      - expires_with_session
      - status
      properties:
        id:
          type: string
        agent_id:
          type: string
        session_id:
          type: string
          pattern: ^ses_[a-z2-7]{26}$
        model:
          type: string
        api_format:
          type: string
        api_variant:
          type: string
        base_url:
          type: string
        endpoint_path:
          type: string
        fingerprint:
          type: string
          description: First 16 hex chars of sha256(key).
        key_hint:
          type: string
          description: Last 4 characters of the key, never the key.
        status:
          type: string
          enum:
          - active
          - expired
          - revoked
        consume_after_turn:
          type: boolean
        created_at:
          type: string
          format: date-time
        expires_with_session:
          type: boolean
          description: The override stays active until its session is archived.
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Absent for a session-lifetime override.
        revoked_at:
          type: string
          format: date-time
    AgentModelOverridePatch:
      type: object
      additionalProperties: false
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 200
        provider:
          $ref: '#/components/schemas/AgentModelOverrideProvider'
        api_key:
          type: string
          minLength: 8
          maxLength: 4096
          writeOnly: true
        ttl_seconds:
          type: integer
          minimum: 300
          maximum: 86400
    AgentModelOverrideProvider:
      type: object
      additionalProperties: false
      required:
      - api_format
      - base_url
      properties:
        api_format:
          type: string
          enum:
          - openai-responses
          - openai-chat-completions
          - anthropic-messages
        api_variant:
          type: string
          enum:
          - default
          - openrouter
          default: default
        base_url:
          type: string
          format: uri
          maxLength: 2048
          description: HTTPS origin only; must not contain userinfo, query, fragment or a trailing slash. Private and link-local
            hosts are rejected by provider validation.
        endpoint_path:
          type: string
          pattern: ^/
          maxLength: 512
          default: /v1/chat/completions
    AgentModelOverrideInput:
      type: object
      additionalProperties: false
      required:
      - model
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 200
          description: Provider model slug (for example deepseek-flash).
        provider:
          $ref: '#/components/schemas/AgentModelOverrideProvider'
        api_key:
          type: string
          minLength: 8
          maxLength: 4096
          writeOnly: true
          description: Write-only. Never returned, logged, or emitted; encrypted at rest.
        ttl_seconds:
          type: integer
          minimum: 300
          maximum: 86400
          default: 3600
        expires_with_session:
          type: boolean
          default: false
          description: Keep the override active until the session is archived instead of a TTL.
        context_window_tokens:
          type: integer
          minimum: 2
          maximum: 2147483647
          description: Model context window in tokens. When omitted, BMA reads it from the provider's models endpoint, then
            a public model catalog, and otherwise uses 128000.
        max_output_tokens:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Maximum output tokens per response; must be below the context window. When omitted, BMA keeps its default
            output policy for the API format.
        auto_compact_window_tokens:
          type: integer
          minimum: 2
          maximum: 2147483647
          description: Compact the session as if the context window were this size, to bound per-turn cost and latency on
            large-window models. Must not exceed the context window.
