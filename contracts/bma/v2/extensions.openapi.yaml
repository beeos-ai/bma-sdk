    BmaAgentHarness:
      type: object
      description: The brain of an agent (`bma_harness`), written on create and update and read back. `default` (or null)
        is the platform's default brain and reads back as an omitted field.
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - default
          - embedded
          - acp
          - executor
          description: '`default` is the BMA kernel; `embedded` a brain the platform hosts itself (agent `dsh` or `go`); `acp`
            an agent the session''s machine runs (agent `claude-code` or `dsh`); `executor` an external full agent declared
            by one explicit machine. Only a brain the platform has brought online and can host is accepted: otherwise 400
            `invalid_request_error` with `bma_error_code` `harness_unavailable`, on agent create/update (embedded) and session
            create (acp, when the environment''s executor does not declare the agent).'
        agent:
          type: string
          description: The embedded or ACP agent, or an external executor id declared in the machine agent capability; not
            allowed for kind `default`.
      additionalProperties: false
    BmaSessionHarness:
      type: object
      description: The session's brain (`bma_harness`). On create it overrides the agent's brain for this session (same values
        as the agent's; `placement` is not accepted); on read it adds where the environment runs the brain.
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - default
          - embedded
          - acp
          - executor
        agent:
          type: string
        placement:
          type: string
          description: Where the environment runs an `acp` brain, derived from the environment and read only; `sandbox` for
            a cloud environment. An `embedded` brain always runs on the server and has none.
      additionalProperties: false
    BmaEnvironmentHarness:
      type: object
      description: 'The brain of an environment (`bma_harness`, ADR-0058): it runs the environment''s sessions whose session
        and agent name no brain. Same shape and values as the agent''s, without `executor`. A session''s brain is resolved
        when it is created: the session''s `bma_harness`, else the agent''s, else the environment''s, else the platform default;
        an omitted, null or `default` value names none (it inherits) and is never stored as a brain.'
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - default
          - embedded
          - acp
          description: '`default` (or null) clears it: the platform default applies. `embedded` agent `go` or `dsh`; `acp`
            agent `claude-code` or `dsh`, which the session''s machine must declare when a session is created (400 `harness_unavailable`
            otherwise, as for an agent). An embedded brain the platform does not host is 400 `harness_unavailable`.'
        agent:
          type: string
          description: The embedded or ACP agent; not allowed for kind `default`.
      additionalProperties: false
    BmaFileLabels:
      description: A file's caller-defined string labels (native File.metadata).
      type: object
      additionalProperties:
        type: string
    BmaSessionExecutorConfig:
      type: object
      description: Turn settings of a session whose brain runs in an executor (`bma_executor_config`). Every turn's `turn.start`
        config carries them as they are; the platform checks only type and length, and the executor decides whether a directory
        is allowed or a level exists (a value it refuses fails the turn). No Managed Agents equivalent; the closest is the
        per-query options of the Claude Agent SDK (`cwd`, `effort`).
      properties:
        permission:
          type: string
          enum:
          - ask
          - read_only
          - workspace
          - full_access
          description: Explicit session permission for tools on a BYO executor; ignored for pools or remote hands. Executor
            ceilings and platform tool denials still apply.
        model:
          type: string
          minLength: 1
          maxLength: 200
          description: Model name for a BYO executor using its own model credentials. The executor validates it against its
            declared model catalog. Ignored on managed pool machines and executors declaring harness_model, whose platform-issued
            credentials remain bound to the session model. For a brain on its machine owner's own credentials (harness `model_credentials`
            `owner`, for example Claude Code; ADR-0068) it is the only model the brain runs (the agent's model is never sent;
            omitted runs the owner's default) and, with `thinking_level`, must be one the machine's brain offers, else the
            create or update is 400 `bma_error_code` `model_not_available` naming the offered models.
        cwd:
          type: string
          minLength: 1
          maxLength: 4096
          description: Working directory of the brain on its machine (ACP `session/new.cwd`), at most 4096 bytes.
        thinking_level:
          type: string
          minLength: 1
          maxLength: 64
          description: Thinking or reasoning-effort level, one of the levels the executor declares for the model (for example
            `none`, `low`, `medium`, `high`), at most 64 bytes.
        options:
          type: object
          description: Non-secret executor-specific scalar preferences, at most 4096 encoded bytes. Forwarded only as turn
            metadata executor_options; cannot replace platform credentials.
          additionalProperties:
            oneOf:
            - type: string
              maxLength: 4096
            - type: number
            - type: boolean
      additionalProperties: false
    BmaAgentRequirements:
      type: object
      description: 'What an agent requires of the machine that is its hands (`bma_requirements`): a constraint, not a location.
        Where the brain and hands run is decided by the environment (`bma_placement`) and the scheduler matches these requirements
        against the environment''s candidates. Changing it creates a new agent version. Omitted or null means no requirement
        (the current behavior).'
      properties:
        hands:
          $ref: '#/components/schemas/BmaHandsRequirements'
      additionalProperties: false
    BmaHandsRequirements:
      type: object
      description: Requirements of the hands machine. Every listed value must hold (AND across `os` as one set and across
        all `capabilities`); an omitted or empty list adds no requirement.
      properties:
        os:
          type: array
          uniqueItems: true
          description: The hands machine runs one of these operating systems. A machine reports its own value (`darwin` is
            matched as `macos`); a pool machine is matched by its template's specification.
          items:
            type: string
            enum:
            - linux
            - macos
            - windows
        capabilities:
          type: array
          uniqueItems: true
          description: Capabilities the hands machine must declare (`display` is the desktop). Unknown names are 400 `invalid_request_error`.
          items:
            type: string
            enum:
            - shell
            - files
            - terminal
            - display
            - computer_use
            - session_files
            - chrome
      additionalProperties: false
    BmaPlacementMachineSelector:
      type: object
      description: Which machines a role may use; give exactly one of `ids` and `labels`. Machines must exist and be granted
        to the project (404 `not_found_error` otherwise). Labels are what the machine's executor reports about itself plus
        `os:<os>` and `arch:<arch>`; they only narrow a choice among machines the project is already authorized to use, and
        no authorization or security decision depends on them.
      properties:
        ids:
          type: array
          minItems: 1
          uniqueItems: true
          description: Specific machines (or a group of machines); the scheduler picks among them.
          items:
            $ref: '#/components/schemas/MachineID'
        labels:
          type: array
          minItems: 1
          uniqueItems: true
          description: Machines that carry all of these labels (each 1-64 characters of `a-z0-9._-`, or an automatic `os:`
            / `arch:` label).
          items:
            type: string
            maxLength: 69
      additionalProperties: false
    BmaPlacementPreference:
      type: object
      description: A soft preference used when scoring candidates; never excludes a machine.
      required:
      - labels
      - weight
      properties:
        labels:
          type: array
          minItems: 1
          uniqueItems: true
          description: Candidates carrying all of these labels score `weight`; the weights of the matching preferences add
            up.
          items:
            type: string
        weight:
          type: integer
          minimum: 1
          maximum: 100
      additionalProperties: false
    BmaEnvironmentBrainPlacement:
      type: object
      description: Where the environment runs the brain.
      properties:
        location:
          type: string
          enum:
          - server
          - colocated
          - machine
          description: '`server` runs the brain on the platform and fits only a `default` or `embedded` brain; `colocated`
            runs it on the machine that is the hands and `machine` on a machine chosen with `machines`; both fit only an `acp`
            brain. Omitted: derived from the environment and the agent''s brain (ADR-0002). A brain that does not fit the
            location is 400 `invalid_request_error` with `bma_error_code` `harness_unavailable` when a session is created.'
        machines:
          $ref: '#/components/schemas/BmaPlacementMachineSelector'
        prefer:
          type: array
          items:
            $ref: '#/components/schemas/BmaPlacementPreference'
      additionalProperties: false
    BmaEnvironmentHandsPlacement:
      type: object
      description: Where the hands (the machine tools run on) come from.
      properties:
        machines:
          $ref: '#/components/schemas/BmaPlacementMachineSelector'
        prefer:
          type: array
          items:
            $ref: '#/components/schemas/BmaPlacementPreference'
      additionalProperties: false
    BmaEnvironmentScheduling:
      type: object
      description: How the scheduler waits when a choice is blocked by something that can change (a machine offline, draining,
        full or leased by another session). A choice that no declared machine can ever satisfy is rejected when the session
        is created, never queued.
      properties:
        queue_timeout_seconds:
          type:
          - integer
          - 'null'
          minimum: 30
          maximum: 86400
          description: 'How long a turn may wait to be bound before it ends with `session.error` `bma_error_code` `scheduling_timeout`
            and the session goes idle (the session stays open and the next input is scheduled again). Null or omitted: the
            platform default (a pool machine 5 minutes, a BYO machine no deadline).'
        brain_offline_timeout_seconds:
          type: integer
          minimum: 30
          maximum: 86400
          default: 600
          description: How long a turn waits for a brain that runs on a machine and lost its connection before the turn ends
            with `session.error` `bma_error_code` `brain_unavailable`. A machine brain is not moved to another host (its state
            lives on that machine); processes already running on the hands machine are not killed by the disconnect. Applies
            to `machine` and `colocated` brains; a platform-hosted brain is moved to another host instead. Default 600.
      additionalProperties: false
    BmaEnvironmentPlacement:
      type: object
      description: Where an environment puts the brain and where the hands come from, and how the scheduler waits (`bma_placement`
        on an environment). A change only affects sessions bound after it; a bound session keeps its machines. Not accepted
        (400 `invalid_request_error`) on an environment projected from a machine (`bma_machine`), whose placement is derived.
        A `self_hosted` environment needs `hands.machines`; a `cloud` environment without it uses its own pool. Mixing cloud
        and BYO hands is 400.
      properties:
        brain:
          $ref: '#/components/schemas/BmaEnvironmentBrainPlacement'
        hands:
          $ref: '#/components/schemas/BmaEnvironmentHandsPlacement'
        scheduling:
          $ref: '#/components/schemas/BmaEnvironmentScheduling'
      additionalProperties: false
    BmaSessionPlacementRequest:
      type: object
      description: 'Per-session choice of machines (`bma_placement` on session create). Each machine must be among the environment''s
        candidates, else 400 `invalid_request_error` with `bma_error_code` `placement_unsatisfiable`; an unknown or ungranted
        machine is 404 `not_found_error`. Omitted: the scheduler chooses. A BYO hands machine whose owner has not allowed
        a remote brain, with the brain on another machine, is 403 `permission_error` with `bma_error_code` `remote_brain_not_allowed`
        (a platform-hosted brain is not restricted by that switch).'
      properties:
        brain:
          $ref: '#/components/schemas/BmaSessionPlacementMachine'
        hands:
          $ref: '#/components/schemas/BmaSessionPlacementMachine'
      additionalProperties: false
    BmaSessionPlacementMachine:
      type: object
      required:
      - machine_id
      properties:
        machine_id:
          $ref: '#/components/schemas/MachineID'
      additionalProperties: false
    BmaSessionPlacementRole:
      type: object
      description: Where one role of the session is bound, and the role's own status. The values are those of the role's `session.bma_placement`
        events.
      required:
      - machine_id
      - status
      properties:
        machine_id:
          type:
          - string
          - 'null'
          description: The bound machine. Null for a platform-hosted brain (the platform's own service identity is not exposed),
            for a brain that is `queued`, and for pool hands (and a brain colocated with them) that no machine has been claimed
            for yet.
        location:
          type: string
          enum:
          - server
          - colocated
          - machine
          description: 'Brain only: where the brain runs.'
        source:
          type: string
          enum:
          - machine
          - pool
          description: 'Hands only: `machine` is a BYO or persistent machine named by the placement or the session; `pool`
            is a machine claimed from the environment''s pool at the first machine tool.'
        status:
          type: string
          enum:
          - bound
          - queued
          - unbound
          - failed
          description: '`bound`: bound to `machine_id` (a platform-hosted brain is always bound). `queued` (brain): no candidate
            machine was online; the first to come online gets it. `unbound`: waiting for a machine to be claimed (pool hands,
            and a brain colocated with them). `failed` (brain): the machine is gone for good.'
        reason:
          type: string
          description: 'Brain only, when not `bound`: `offline` for `queued`, `brain_unavailable` for `failed`.'
      additionalProperties: false
    BmaSessionPlacement:
      type: object
      description: 'Read-only placement of a session (`bma_placement` on a session response): what the scheduler bound, read
        from the session''s binding, brain and hands apart. Each change of it is also reported as a `session.bma_placement`
        event.'
      required:
      - brain
      - hands
      - status
      properties:
        brain:
          $ref: '#/components/schemas/BmaSessionPlacementRole'
        hands:
          $ref: '#/components/schemas/BmaSessionPlacementRole'
        status:
          type: string
          enum:
          - bound
          - queued
          - unbound
          - failed
          description: 'The worst of the two roles: `failed`, else `queued` (waiting for something that can change; see the
            latest `session.bma_placement` event), else `unbound` (a machine has not been claimed yet: pool hands are claimed
            at the first machine tool), else `bound`.'
      additionalProperties: false
    SessionBmaPlacementEvent:
      type: object
      x-bma-event: true
      description: 'Session event `session.bma_placement`: a scheduling decision for one role of the session. It only reports;
        it triggers no action. Official clients ignore event types they do not know. Carries `bma_sequence` like every other
        session event.'
      required:
      - type
      - role
      - outcome
      properties:
        type:
          type: string
          enum:
          - session.bma_placement
        id:
          type: string
        processed_at:
          type: string
          format: date-time
        role:
          type: string
          enum:
          - brain
          - hands
        outcome:
          type: string
          enum:
          - bound
          - queued
          - rebound
          - released
          - failed
          description: '`bound`: a machine was chosen. `queued`: no candidate is available now (`reason` says why). `rebound`:
            pool hands were lost and replaced from the same pool (the user directory and session files are restored from the
            session''s home backup; processes and memory state are not). `released`: the binding ended. `failed`: no binding
            is possible any more (see the matching `session.error`).'
        machine_id:
          type:
          - string
          - 'null'
          description: The machine concerned; null for a platform-hosted brain.
        reason:
          type:
          - string
          - 'null'
          description: Why the outcome happened, for example `offline`, `draining`, `full`, `lease_busy` for `queued`. An
            open set; receivers must accept values they do not know.
        filtered:
          type: object
          description: How many candidates each filter removed, keyed by reason (for example `missing_capability_display`).
          additionalProperties:
            type: integer
            minimum: 0
        queued_for_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: 'For `bound` after a wait: how long the turn waited.'
      additionalProperties: false
    BmaEnvironmentWallpaper:
      type: object
      required:
      - file_id
      properties:
        file_id:
          type: string
          description: A file of the Files API shown as the default wallpaper of new desktops.
      additionalProperties: false
    BmaEnvironmentDesktop:
      type: object
      description: Desktop defaults of an environment (`bma_desktop`).
      properties:
        wallpaper:
          anyOf:
          - $ref: '#/components/schemas/BmaEnvironmentWallpaper'
          - type: 'null'
      additionalProperties: false
    BmaEnvironmentMachineLease:
      type: object
      description: Who runs on a persistent machine; sessions borrowing it run their turns one at a time and the rest wait.
      required:
      - session_id
      - queued_sessions
      properties:
        session_id:
          type:
          - string
          - 'null'
        queued_sessions:
          type: integer
          minimum: 0
      additionalProperties: false
    BmaEnvironmentMachine:
      type: object
      description: The machine an environment is projected from (`bma_machine`); read-only.
      required:
      - machine_id
      - source_kind
      - lease
      properties:
        machine_id:
          $ref: '#/components/schemas/MachineID'
        source_kind:
          $ref: '#/components/schemas/MachineSourceKind'
        lease:
          $ref: '#/components/schemas/BmaEnvironmentMachineLease'
        harnesses:
          type: array
          description: Ids of the hosted agents the machine's executor declared (for example `dsh`, `claude-code`), so a client
            can choose a machine for an `acp` brain. Omitted when the executor declared none.
          items:
            type: string
        labels:
          type: array
          description: Labels the executor reported about itself plus the platform's `os:<os>` and `arch:<arch>`.
          items:
            type: string
        remote_brain_allowed:
          type: boolean
          description: Read-back of the owner's switch "allow a remote brain to use this machine" (executor capability `remote_brain`);
            it can only be changed in the executor's local configuration. False when absent.
      additionalProperties: false
    BmaMCPServerAuth:
      type: object
      description: The project secret an MCP server authenticates with (`bma_auth`); reads never return the secret.
      required:
      - type
      - secret_id
      properties:
        type:
          type: string
          enum:
          - bearer
          - oauth
          - sigv4
        secret_id:
          $ref: '#/components/schemas/SecretID'
        service:
          type: string
          description: Required with `sigv4`, rejected otherwise.
        region:
          type: string
          description: Required with `sigv4`, rejected otherwise.
      additionalProperties: false
