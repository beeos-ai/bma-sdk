components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
    bearer:
      type: http
      scheme: bearer
  parameters:
    ProjectHeader:
      name: x-bma-project-id
      in: header
      required: false
      schema:
        type: string
      description: 'Project scope. Required when the API key can access more than one project (alias: anthropic-workspace-id).'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
      description: Replays the first result of a create; the same key with another body is 409.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: string
      description: Opaque cursor from `next_page`.
    IncludeArchived:
      name: include_archived
      in: query
      schema:
        type: boolean
      description: Include archived records. Defaults to false.
  responses:
    Error:
      description: Anthropic error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - type
      - error
      properties:
        type:
          const: error
        error:
          type: object
          required:
          - type
          - message
          properties:
            type:
              type: string
              enum:
              - invalid_request_error
              - authentication_error
              - permission_error
              - not_found_error
              - rate_limit_error
              - api_error
            message:
              type: string
            code:
              type: string
              description: BMA reason, kept as the native code.
        request_id:
          type: string
    Project:
      type: object
      required:
      - type
      - id
      - org_id
      - name
      - created_at
      - updated_at
      properties:
        type:
          type: string
          const: project
        id:
          $ref: '#/components/schemas/ProjectID'
        org_id:
          $ref: '#/components/schemas/OrganizationID'
        name:
          $ref: '#/components/schemas/ResourceName'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      additionalProperties: false
      x-bma-native-schema: ProjectFields
    ListProject:
      type: object
      required:
      - data
      - next_page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        next_page:
          type:
          - string
          - 'null'
    MachinePool:
      type: object
      required:
      - type
      - id
      - org_id
      - name
      - management_kind
      - description
      - provider
      - default_machine_cpu
      - default_machine_memory_mb
      - default_machine_env
      - default_machine_secret_env
      - default_machine_provider_options
      - default_cwd
      - provider_config
      - runtime_protection_enabled
      - max_total_machines
      - max_total_cpu
      - max_total_memory_mb
      - min_machine_cpu
      - min_machine_memory_mb
      - max_machine_cpu
      - max_machine_memory_mb
      - delete_after_idle_minutes
      - pause_after_idle_minutes
      - archive_after_paused_days
      - delete_after_paused_days
      - metadata
      - created_at
      - updated_at
      properties:
        type:
          type: string
          const: machine_pool
        id:
          $ref: '#/components/schemas/MachinePoolID'
        org_id:
          $ref: '#/components/schemas/OrganizationID'
        name:
          $ref: '#/components/schemas/ResourceName'
        management_kind:
          $ref: '#/components/schemas/ManagementKind'
        description:
          type: string
        provider:
          type: string
        default_machine_cpu:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 1
          maximum: 2147483647
        default_machine_memory_mb:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 1
          maximum: 2147483647
        default_machine_env:
          description: Default environment for pool machines. A machine's environment, including resolved secret_env values,
            is applied to the provider machine at provisioning, so the provider_options startup_script and the daemon run
            with it, and is resolved again for each process at launch.
          type: object
