    - type: 'null'
- operation: GET /v1/environments, GET /v1/environments/{environment_id}, POST /v1/environments, POST /v1/environments/{environment_id}
  direction: response
  field: bma_placement
  description: The placement the environment declares; omitted when it declares none.
  schema:
