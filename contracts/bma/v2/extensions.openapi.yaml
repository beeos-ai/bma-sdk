- operation: GET /v1/agents, GET /v1/agents/{agent_id}
  direction: response
  field: bma_session_harness_capabilities
  description: Separately advertises input controls available when a NEW session explicitly overrides the default kernel with
    embedded:dsh. This is not the current profile default or an existing session capability, and never authorizes input acceptance
    or dispatch. A client must freeze the chosen override at creation.
  schema:
    $ref: '#/components/schemas/InputSessionHarnessCapabilities'
- operation: GET /v1/agents, GET /v1/agents/{agent_id}
