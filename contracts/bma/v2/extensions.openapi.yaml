openapi: 3.1.0
info:
  title: 'BMA Anthropic-compatible API: BMA extensions'
  version: 1.0.0
  description: 'Additive BMA extensions served by the Anthropic facade (`api.<env>/v1`) next to the Managed Agents routes.
    Extension resources follow the Anthropic style (ADR 0023 1.3.3): top-level `/v1/<plural_snake>` paths, POST updates and
    actions, `{data, next_page}` lists, the Anthropic error envelope (BMA reasons in `error.bma_error_code`), `Idempotency-Key`
    on creates and the `bma-workspace-id` scope header. Each operation is a projection of one native operation (`x-bma-native-operation`):
    request bodies are forwarded and validated by the native schema, responses are the native object plus `type`. Extension
    fields on Anthropic objects are top-level `bma_*` properties.


    Self-contained snapshot for bma-sdk 2.0 (tools/v2/bundle_contract.py): native schemas copied in, deprecated operations
    removed.'
servers:
- url: /v1
security:
- apiKey: []
- bearer: []
tags:
- name: Deployments
  description: Anthropic's deployments and deployment_runs. A deployment is compiled when written and its runs create sessions
    exactly like sessions.create, as the principal that last wrote it.
- name: Vaults
  description: Vaults and credentials in Anthropic's shape (BetaManagedAgentsVault / BetaManagedAgentsCredential). A vault
    is an independent resource; a project can have any number of them. BMA stores each vault and credential as a project-owned
    native secret (a vault is a tagged record, a credential is tagged with its vault id), so metadata keys starting with `bma_`
    are reserved, and a vault leaves 13 and a credential 12 of the native 16 metadata pairs to the caller. Credentials never
    return secret material.
- name: Terminal sessions
  description: Terminal sessions. `machine_id` is named in the body of the create and as the filter of the list; every other
    operation addresses the session by its id alone (404 for an unknown id or one in another project).
- name: Desktop sessions
  description: Remote desktop sessions. `machine_id` is named once, in the body of the create; every other operation addresses
    the session by its id alone (the server resolves the machine and project, and answers 404 for an unknown id or one in
    another project).
- name: Machines
  description: 'Machines: persistent machines owned by the workspace, BYO connect and org machines.'
- name: Projects
  description: Project provisioning (organization subtree).
- name: Machine pools
  description: Organization machine pools and their project grants.
- name: Skills
  description: 'Skills in Anthropic''s shape (BetaSkill), without versions. Every skill is `source.type` `custom`: Anthropic''s
    own skills are not hosted, so listing another source is an empty page. `display_name` is the caller''s free-form label
    (1-255 characters, not unique; the SKILL.md `name` until one is set, which stays `bma_name`) and `latest_version_id` its
    latest revision.'
