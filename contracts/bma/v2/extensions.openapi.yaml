- operation: POST /v1/environments, POST /v1/environments/{environment_id}
  direction: request
  field: bma_harness
  description: The brain of the environment's sessions whose session and agent name none. Omitted keeps the current value
    on update; null or kind `default` clears it (the platform default applies); rejected on an environment projected from
    a machine. A change only affects sessions created after it.
  schema:
