- operation: POST /v1/agents, POST /v1/agents/{agent_id}
  direction: request
  field: bma_auth
  description: Property of an entry of `mcp_servers[]`. The project secret the MCP server authenticates with.
  schema:
    oneOf:
    - $ref: '#/components/schemas/BmaMCPServerAuth'
    - type: 'null'
- operation: GET /v1/agents, GET /v1/agents/{agent_id}, POST /v1/agents, POST /v1/agents/{agent_id}
  direction: response
  field: bma_auth
  description: Property of an entry of `mcp_servers[]`; the secret reference, never the secret.
  schema:
    oneOf:
    - $ref: '#/components/schemas/BmaMCPServerAuth'
    - type: 'null'
- operation: GET /v1/sessions/{session_id}/events, GET /v1/sessions/{session_id}/events/stream, POST /v1/sessions/{session_id}/events
  direction: response
  field: bma_sequence
  description: 'Durable position of the BMA event an event is projected from. One BMA event can project to several events
    (frames) that share its `bma_sequence`, so it is a cursor between BMA events, not a unique frame id. `Last-Event-ID: <n>`
    and the history cursor resume strictly after sequence n; a caller that must not lose a frame of the last sequence it saw
    resumes from n-1 and drops the frames it already applied by event `id`. Absent on events that are not projected from a
    durable event (for example a stream `error`). On the `user.message` send response it is the cursor to subscribe from.'
  schema:
    oneOf:
    - type: integer
      minimum: 1
- operation: POST /v1/sessions/{session_id}/events
  direction: response
  field: bma_resume_cursor
  description: 'On a `user.message` send response only: the `Last-Event-ID` to stream from to receive this message''s `user.message`
    and everything after it. It is the session''s last event sequence before the send (0 for an empty session, still sent),
    because a queued input has no event of its own until it is admitted. For an idempotent replay whose input already has
    its event it is that event''s sequence minus 1. Absent when no safe cursor is known; the caller then locates the turn
    on the stream by `bma_input_id`. The official send response has no cursor; send first, then subscribe from this cursor.'
  schema:
    oneOf:
    - type: integer
      minimum: 0
- operation: GET /v1/sessions/{session_id}/events, GET /v1/sessions/{session_id}/events/stream, POST /v1/sessions/{session_id}/events
  direction: response
  field: bma_input_id
  description: The BMA input a `user.message` was accepted as.
  schema:
    oneOf:
    - type: string
- operation: GET /v1/sessions/{session_id}/events, GET /v1/sessions/{session_id}/events/stream
  direction: response
  field: bma_error_code
  description: 'BMA''s stable reason on a `session.error`, next to the Anthropic error `type`. Scheduling reasons (brain and
    hands apart): `scheduling_timeout` (a turn waited longer than `queue_timeout_seconds`), `brain_unavailable` (the machine
    brain is permanently unavailable, or stayed disconnected longer than `brain_offline_timeout_seconds`; later inputs of
    the session answer 400 with the same code and a new session is needed), `hands_unavailable` (a BYO or persistent hands
    machine is permanently unavailable). The same field is on the 4xx error body of a request: `placement_unsatisfiable` (400
    `invalid_request_error`: no candidate can satisfy the requirements, or a machine chosen for the session is not a candidate)
    and `remote_brain_not_allowed` (403 `permission_error`). A tool call whose hands machine is offline reports the tool result
    `error_code` `environment_unavailable` instead.'
  schema:
    oneOf:
    - type: string
- operation: POST /v1/sessions, POST /v1/sessions/{session_id}/events
  direction: response
  field: bma_error_code
  description: 'On an error response (`error.bma_error_code`, next to the Anthropic error `type`): `placement_unsatisfiable`
    (400 `invalid_request_error`; the message lists how many candidates each filter removed, for example "0/3 machines: 2
    missing capability display, 1 remote_brain disabled"), `remote_brain_not_allowed` (403 `permission_error`), `brain_unavailable`
    (400, an input to a session whose machine brain is permanently unavailable) and `harness_unavailable` (400). `error.code`
    carries the same value until its removal on 2026-12-01 (D-6).'
  schema:
    oneOf:
    - type: string
