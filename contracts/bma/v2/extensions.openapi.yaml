          type: integer
          format: int32
          minimum: 1
          maximum: 3650
        delete_after_paused_days:
          description: Days a machine stays paused before it is deleted, counted from when it paused; a resume ends the paused
            period and the next pause starts a new one. A session that receives input after its machine was deleted gets a
            fresh machine. Machines kept for a person (idle deletion disabled with 0 on their binding or grant) are never
            deleted by it. Requires pause_after_idle_minutes; cannot be combined with archive_after_paused_days.
          type: integer
          format: int32
          minimum: 1
          maximum: 3650
        metadata:
          $ref: '#/components/schemas/MachineMetadata'
        project_id:
          description: 'Creates the pool for this project: the pool is owned by and granted to it, and only to it, in the
            same write. The caller needs project.manage on the project instead of org.manage, and the pool''s secret references
            (provider_auth_secret_id, default_machine_secret_env) must be ones a pool granted to the project already uses.
            Without it the pool is an organization pool granted to no project, which needs org.manage.'
          allOf:
          - $ref: '#/components/schemas/ProjectID'
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          $ref: '#/components/schemas/ResourceName'
x-bma-extension-fields:
- operation: POST /v1/sessions, POST /v1/sessions/{session_id}
  direction: request
  field: bma_model_override
  description: The one shape of a session model override. On create it needs `model` and lasts for the session (`expires_with_session`
    defaults to true unless `ttl_seconds` is sent); it replaces the deprecated `agent.model.api_url/api_key/api_format/context_window_tokens/max_output_tokens/auto_compact_window_tokens`,
    which are still accepted (answered with `Deprecation` and a `Link ... rel="successor-version"` header) but cannot be combined
    with it. On update, an object with `model` replaces the override (native PutAgentSessionModelOverride); an object without
    `model` patches it (PatchAgentSessionModelOverride); null revokes it (DeleteAgentSessionModelOverride). `api_key` is write-only.
  schema:
    oneOf:
    - $ref: '#/components/schemas/AgentModelOverrideInput'
    - $ref: '#/components/schemas/AgentModelOverridePatch'
    - type: 'null'
- operation: GET /v1/sessions/{session_id}, POST /v1/sessions, POST /v1/sessions/{session_id}
  direction: response
  field: bma_model_override
