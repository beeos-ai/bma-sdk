- operation: GET /v1/files, GET /v1/files/{file_id}, POST /v1/files
  direction: response
  field: bma_metadata
  description: The file's labels (set with the X-Bma-File-Metadata upload header, filtered with the `metadata` list parameter);
    `{}` when unlabeled. Replaces the unprefixed `metadata` (removed 11-12).
  schema:
    $ref: '#/components/schemas/BmaFileLabels'
