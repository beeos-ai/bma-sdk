# Models of package bma (repository root); services come from tools/sdkgen.
package: bma
generate:
  models: true
output-options:
  # Keep every schema, including those only daemon operations reference.
  skip-prune: true
  # Go initialisms in generated names (ID, URL, API, ...), as Go code and the
  # Stainless Go SDKs spell them: AgentID, not AgentId.
  name-normalizer: ToCamelCaseWithInitialisms
  additional-initialisms: [IDs]
